name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build latest version
        run: |
          pnpm install --frozen-lockfile
          pnpm build --base=/find-my-basic/
          mkdir -p _site
          cp -R dist/. _site/
          touch _site/.nojekyll

      - name: Build tagged versions
        run: |
          mkdir -p _site/versions
          mapfile -t tags < <(git tag --list 'v*' --sort=-version:refname)

          for tag in "${tags[@]}"; do
            safe_tag="${tag//\//-}"
            version_dir="${RUNNER_TEMP}/find-my-basic-${safe_tag}"
            git worktree add --detach "$version_dir" "$tag"
            (
              cd "$version_dir"
              pnpm install --frozen-lockfile
              pnpm build --base="/find-my-basic/${tag}/"
            )
            mkdir -p "_site/${tag}"
            cp -R "$version_dir/dist/." "_site/${tag}/"
            git worktree remove "$version_dir" --force
          done

          {
            echo '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find My Basic Versions</title>'
            echo '<style>body{margin:0;padding:64px 24px;background:#f4f1e9;color:#171713;font:16px/1.6 system-ui,sans-serif}main{max-width:760px;margin:auto}h1{font-size:clamp(40px,8vw,80px);line-height:1;letter-spacing:-.05em}a{color:inherit}li{padding:16px 0;border-top:1px solid #aaa}</style></head><body><main>'
            echo '<p>FIND MY BASIC</p><h1>Versions</h1><p><a href="../">Latest</a></p><ol>'
            for tag in "${tags[@]}"; do
              echo "<li><a href=\"../${tag}/\">${tag}</a></li>"
            done
            echo '</ol></main></body></html>'
          } > _site/versions/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
